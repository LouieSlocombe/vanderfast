version: 2

# Conda dependencies are pinned in build_tools/conda-linux-64.lock and
# refreshed by hand with `make lock`; Dependabot has no conda ecosystem.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
