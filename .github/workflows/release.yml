name: Release

# Builds release artifacts when a GitHub release is published. Publishing to
# PyPI (CUDA wheels via cibuildwheel, a GPU verification gate, and trusted
# publishing) is added with the first complete release; until then this
# workflow only validates the version and builds the sdist.

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash -el {0}

jobs:
  sdist:
    name: Build the source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the locked conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/conda-linux-64.lock
          environment-name: vanderfast-dev
          cache-environment: false
          cache-downloads: false

      - name: Check the tag matches the project version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version}"
            exit 1
          fi

      - name: Build and check the sdist
        run: |
          python -m build --sdist --no-isolation
          python tools/check_sdist.py dist/*.tar.gz

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
