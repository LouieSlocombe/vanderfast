name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches upstream URL rot for the pinned reference sources.
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  FORCE_COLOR: "1"
  OMP_NUM_THREADS: "1"

defaults:
  run:
    shell: bash -el {0}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the locked conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/conda-linux-64.lock
          environment-name: vanderfast-dev

      - name: Install the package without the CUDA backend
        run: VANDERFAST_ENABLE_CUDA=OFF python -m pip install --no-build-isolation --no-deps -e .

      - name: Run the pre-commit hooks
        run: prek run --all-files --show-diff-on-failure

      - name: Type check
        run: mypy

  test-cpu:
    name: CPU tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: locked
            file: build_tools/conda-linux-64.lock
          - environment: oldest
            file: build_tools/environment-oldest.yml

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ${{ matrix.file }}
          environment-name: vanderfast-dev

      - name: Install the package without the CUDA backend
        run: VANDERFAST_ENABLE_CUDA=OFF python -m pip install --no-build-isolation --no-deps -e .

      - name: Test against the oracle and the dftd3 reference
        run: python -m pytest --require-reference

  data:
    name: Reference data and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the locked conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/conda-linux-64.lock
          environment-name: vanderfast-dev

      - name: Install the package without the CUDA backend
        run: VANDERFAST_ENABLE_CUDA=OFF python -m pip install --no-build-isolation --no-deps -e .

      - name: Regenerate the reference tables from the pinned sources
        run: python -I tools/generate_d3_data.py --check --verify-binary "$CONDA_PREFIX/lib"

      - name: Regenerate the dftd3 fixtures
        run: python tools/generate_fixtures.py --check

  cuda-build:
    name: CUDA build (no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VANDERFAST_RELEASE_BUILD: "ON"
      VANDERFAST_WERROR: "ON"
      VANDERFAST_CUDA_ARCHITECTURES: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the locked conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/conda-linux-64.lock
          environment-name: vanderfast-dev

      - name: Build the wheel for every release architecture
        run: python -m build --wheel --no-isolation

      - name: Check device code and dynamic dependencies
        run: python tools/check_wheel.py dist/*.whl

      - name: Install the wheel and run the tests that need no GPU
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests/cuda" "$GITHUB_WORKSPACE/tests/unit/test_cli.py" \
            --rootdir "$GITHUB_WORKSPACE" -m "native and not cuda" --require-native --no-cov
          python -m mypy.stubtest vanderfast._native \
            --allowlist "$GITHUB_WORKSPACE/tests/stubtest_allowlist.txt"

      - name: Build and run the host C++ tests
        run: |
          cmake -S . -B build/cpp -G Ninja -DVANDERFAST_ENABLE_CUDA=OFF \
            -DVANDERFAST_BUILD_TESTS=ON -DVANDERFAST_WERROR=ON
          cmake --build build/cpp
          ctest --test-dir build/cpp -L host --output-on-failure

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the locked conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/conda-linux-64.lock
          environment-name: vanderfast-dev

      - name: Build the sdist
        run: python -m build --sdist --no-isolation

      - name: Check the sdist contents
        run: python tools/check_sdist.py dist/*.tar.gz

      - name: Install the sdist without CUDA and smoke test it
        run: |
          VANDERFAST_ENABLE_CUDA=OFF python -m pip install --no-build-isolation --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP" && vanderfast verify-data && vanderfast info

  all-green:
    name: All checks passed
    if: always()
    needs: [lint, test-cpu, data, cuda-build, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
