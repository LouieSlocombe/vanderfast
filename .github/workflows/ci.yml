name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches upstream URL rot for the pinned reference sources.
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  OMP_NUM_THREADS: "1"
  # Hosted runners mix AVX2 and AVX-512 CPUs. The fixtures are reproduced to
  # ~1e-13 and the D4 charge solve amplifies one-ulp differences by ~1e6, so
  # pin the code paths the fixtures were generated with: AVX2 OpenBLAS kernels
  # and no AVX-512 NumPy loops (their float64 exp, log, and power differ from
  # glibc in the last bit).
  OPENBLAS_CORETYPE: Haswell
  NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR

defaults:
  run:
    shell: bash -el {0}

jobs:
  check:
    name: Lint, reference data, and CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the locked conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/conda-linux-64.lock
          environment-name: vanderfast-dev

      - name: Install the package without the CUDA backend
        run: make dev-cpu

      - name: Lint and type check
        run: make lint

      - name: Regenerate the reference tables and fixtures from the pinned sources
        if: ${{ !cancelled() }}
        run: make data-check fixtures-check

      - name: Test against the oracle and the dftd3 and dftd4 references
        if: ${{ !cancelled() }}
        run: python -m pytest --require-reference

  oldest:
    name: CPU tests (oldest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # NumPy 2.3 names its AVX-512 targets individually.
      NPY_DISABLE_CPU_FEATURES: >-
        AVX512F AVX512CD AVX512_KNL AVX512_KNM AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the oldest supported conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/environment-oldest.yml
          environment-name: vanderfast-dev

      - name: Install the package without the CUDA backend
        run: make dev-cpu

      - name: Test against the oracle and the dftd3 and dftd4 references
        run: python -m pytest --require-reference

  build:
    name: Distributions and CUDA build (no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VANDERFAST_RELEASE_BUILD: "ON"
      VANDERFAST_WERROR: "ON"
      VANDERFAST_CUDA_ARCHITECTURES: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the locked conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: build_tools/conda-linux-64.lock
          environment-name: vanderfast-dev

      # Without --sdist or --wheel, build makes the sdist and then builds the
      # wheel from it, so an incomplete sdist fails here.
      - name: Build the sdist, then the wheel from it for every release architecture
        run: python -m build --no-isolation

      - name: Check the sdist contents, device code, and dynamic dependencies
        run: |
          python tools/check_sdist.py dist/*.tar.gz
          python tools/check_wheel.py dist/*.whl

      - name: Install the wheel and run the tests that need no GPU
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          vanderfast verify-data
          vanderfast info
          python -m pytest "$GITHUB_WORKSPACE/tests/cuda" "$GITHUB_WORKSPACE/tests/unit/test_cli.py" \
            --rootdir "$GITHUB_WORKSPACE" -m "native and not cuda" --require-native --no-cov
          python -m mypy.stubtest vanderfast._native \
            --allowlist "$GITHUB_WORKSPACE/tests/stubtest_allowlist.txt"

      - name: Build and run the host C++ tests
        run: |
          cmake -S . -B build/cpp -G Ninja -DVANDERFAST_ENABLE_CUDA=OFF \
            -DVANDERFAST_BUILD_TESTS=ON -DVANDERFAST_WERROR=ON
          cmake --build build/cpp
          ctest --test-dir build/cpp -L host --output-on-failure

  all-green:
    name: All checks passed
    if: always()
    needs: [check, oldest, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
