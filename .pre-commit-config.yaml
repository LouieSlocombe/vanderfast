repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The generated D3 reference table (~500 KiB) is regenerated
        # byte-identically in CI by tools/generate_d3_data.py --check.
        exclude: ^src/vanderfast/data/d3_reference\.bin$
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: vanderfast-data-hashes
        name: bundled reference data matches its manifest
        entry: python tools/check_data_hashes.py
        language: python
        pass_filenames: false
        files: ^src/vanderfast/data/
