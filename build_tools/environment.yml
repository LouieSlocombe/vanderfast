name: vanderfast-dev

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Runtime
  - python=3.14
  - pip>=25.1
  - numpy>=2.3.3
  - ase>=3.26
  # Pinned numerical reference (optional at runtime, required for fixtures/tests)
  - dftd3-python=1.6.0
  - simple-dftd3=1.6.0
  - dftd4-python=4.2.0
  - dftd4=4.2.0
  - multicharge=0.5.0
  # Build backend and native toolchain (CUDA 12.9 accepts host GCC <= 14)
  - scikit-build-core>=1.1.1
  - pybind11>=3.0.1
  - cmake>=4.1
  - ninja
  - python-build
  - cuda-version=12.9
  - cuda-nvcc
  - cuda-cudart-dev
  - cuda-cudart-static
  - cuda-cuobjdump
  - gxx_linux-64=14.*
  - libstdcxx>=14
  - catch2>=3.5
  - ccache
  # Test and development tools
  - pytest>=9.1.1
  - pytest-cov>=7.1.0
  - ruff>=0.16.10
  - mypy>=2.4.0
  - prek>=0.5.5
  - twine>=6
